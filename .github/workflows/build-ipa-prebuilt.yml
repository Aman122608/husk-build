name: build-ipa-prebuilt

# A runnable IPA in minutes instead of hours, by reusing the graphics/QEMU
# binaries from a released Husk IPA and compiling only the app. See
# scripts/build_ipa_prebuilt.sh for why that is sound for a translation-layer
# change, and what it does not cover.
on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream release whose graphics/QEMU binaries to reuse
        default: "1.1.0"

jobs:
  ipa:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install xcodegen
          rustup target add aarch64-apple-ios
          xcodebuild -version

      - name: Build IPA from upstream binaries
        env:
          HUSK_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: bash ./scripts/build_ipa_prebuilt.sh build/Husk.ipa

      - name: Upload logs (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-logs-${{ github.run_id }}
          path: |
            build/logs/
            build/DerivedData*/build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Husk-prebuilt-${{ github.sha }}
          path: |
            build/Husk.ipa
            build/Husk.tipa
          if-no-files-found: error
          retention-days: 30
