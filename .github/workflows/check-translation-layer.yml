name: check-translation-layer

# The translation layer is plain C that the app target compiles; on a Mac it can be
# compiled on its own in seconds, against the real iPhoneOS SDK, without building
# QEMU/ANGLE/MoltenVK first. That is the fast signal that a change to
# src/translation-layer-next compiles the way the app builds it -- use it before
# waiting hours on build-ios.yml.
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/translation-layer-next/**'
      - 'src/translation-layer/**'
      - '.github/workflows/check-translation-layer.yml'
  pull_request:
    paths:
      - 'src/translation-layer-next/**'
      - 'src/translation-layer/**'

jobs:
  compile:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Compile src/translation-layer-next for arm64-apple-ios
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          MIN=16.0
          # The same include dirs the app target uses; the sources define
          # _DARWIN_C_SOURCE themselves, and no OTHER_CFLAGS are set in project.yml.
          INC="-Isrc/translation-layer-next -Isrc/translation-layer"
          mkdir -p /tmp/tl-obj
          fail=0
          # *.m as well as *.c: the Vulkan integration that MoltenVK hangs off is Objective-C
          # (husk-tl-vulkan.m), and compiling only *.c left it outside the gate entirely -- a change
          # there could only ever be caught five minutes into build-ipa-prebuilt, which is the exact
          # thing this workflow exists to avoid.
          for f in src/translation-layer-next/*.c src/translation-layer-next/*.m; do
            obj="/tmp/tl-obj/$(basename "${f%.c}").o"
            # The app target sets CLANG_ENABLE_OBJC_ARC = YES and these .m files use __weak, which
            # does not exist under manual reference counting: without this the gate reports an error
            # in a file that builds perfectly in the real target. Mirror the app's flags, or the gate
            # is measuring a build nobody performs.
            arc=""; case "$f" in *.m) arc="-fobjc-arc";; esac
            if ! clang -isysroot "$SDK" \
                   -target "arm64-apple-ios${MIN}" -miphoneos-version-min=${MIN} \
                   $INC $arc -c "$f" -o "$obj" 2> "/tmp/tl-obj/err.txt"; then
              echo "::error file=$f::does not compile for arm64-apple-ios"
              sed -n '1,12p' "/tmp/tl-obj/err.txt"
              fail=1
            fi
          done
          exit $fail

      # The app target compiles BOTH translation-layer directories, and the older one is where the
      # loader and the bionic shim live. Compiling only -next left that half unguarded: a missing
      # <math.h> in husk-tl-shim.c kept this workflow green while build-ipa-prebuilt failed five
      # minutes in. Check the same set the app builds.
      - name: Compile src/translation-layer for arm64-apple-ios
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          MIN=16.0
          INC="-Isrc/translation-layer-next -Isrc/translation-layer"
          mkdir -p /tmp/tl-obj-old
          fail=0
          for f in src/translation-layer/*.c src/translation-layer/*.m; do
            obj="/tmp/tl-obj-old/$(basename "${f%.c}").o"
            arc=""; case "$f" in *.m) arc="-fobjc-arc";; esac
            if ! clang -isysroot "$SDK" \
                   -target "arm64-apple-ios${MIN}" -miphoneos-version-min=${MIN} \
                   $INC $arc -c "$f" -o "$obj" 2> "/tmp/tl-obj-old/err.txt"; then
              echo "::error file=$f::does not compile for arm64-apple-ios"
              sed -n '1,12p' "/tmp/tl-obj-old/err.txt"
              fail=1
            fi
          done
          exit $fail
